<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Some Kaisen">
  <!--
    A ring that is nearly, but not quite, closed.

    The app is about days accumulating rather than days being perfect, so the mark is a run
    in progress rather than a finished tick. Drawn as one heavy stroke and one dot: at
    sixteen pixels anything finer turns to mush.
  -->
  <rect width="64" height="64" rx="16" fill="#1c1c1a" />
  <circle
    cx="32"
    cy="32"
    r="15"
    fill="none"
    stroke="#4a4944"
    stroke-width="7"
  />
  <path
    d="M32 17a15 15 0 0 1 12.99 22.5"
    fill="none"
    stroke="#c9a227"
    stroke-width="7"
    stroke-linecap="round"
  />
  <circle cx="32" cy="32" r="4" fill="#fbfaf8" />
</svg>
